{% extends "base.html" %}

{% block title %}
ResumeXpert | Login
{% endblock %}

{% block content %}



<div class="auth-wrapper">

    <div class="auth-card">

        <div class="logo">

            <div class="logo-circle">
                <i class="fa-solid fa-file-lines"></i>
            </div>

            <h1>
                Resume<span>Xpert</span>
            </h1>

            <p>
                AI Powered Resume Analysis Platform
            </p>

        </div>

        <div class="welcome">

            <h2>
                Welcome Back
            </h2>

            <p>
                Sign in to continue your journey
            </p>

        </div>

        <form method="POST" action="{{ url_for('login') }}">

            <div class="field">

                <label>Email Address</label>

                <div class="input-group">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

            </div>

            <div class="field">

                <label>Password</label>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                    <span id="togglePassword">
                        Show
                    </span>

                </div>

            </div>

            <div class="row">

                <label>

                    <input
                        type="checkbox"
                        name="remember">

                    Remember Me

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <button
                type="submit"
                class="primary-btn">

                Sign In

                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </form>

        <div class="divider"></div>

        <div class="footer">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Create Account
            </a>

        </div>

    </div>

</div>

{% endblock %}
