<div class="upload-section">

    <!-- Resume Upload -->

    <div class="upload-card">

        <div class="upload-top">

            <div class="upload-icon">
                <i class="fa-solid fa-file-arrow-up"></i>
            </div>

            <div>

                <h2>Resume</h2>

                <p>PDF / DOCX (Max 5 MB)</p>

            </div>

        </div>

        <label class="drop-zone" for="resumeFile">

            <input
                type="file"
                id="resumeFile"
                accept=".pdf,.doc,.docx"
                hidden
            >

            <i class="fa-solid fa-cloud-arrow-up"></i>

            <h3>Drag & Drop Resume</h3>

            <span>or click to browse</span>

        </label>

        <div class="file-name" id="resumeName">

            No file selected

        </div>

    </div>

    <!-- Job Description -->

    <div class="upload-card">

        <div class="upload-top">

            <div class="upload-icon green">
                <i class="fa-solid fa-briefcase"></i>
            </div>

            <div>

                <h2>Job Description</h2>

                <p>PDF / DOCX / TXT</p>

            </div>

        </div>

        <label class="drop-zone" for="jdFile">

            <input
                type="file"
                id="jdFile"
                accept=".pdf,.doc,.docx,.txt"
                hidden
            >

            <i class="fa-solid fa-cloud-arrow-up"></i>

            <h3>Drag & Drop Job Description</h3>

            <span>or click to browse</span>

        </label>

        <div class="file-name" id="jdName">

            No file selected

        </div>

    </div>

</div>
